name: Test

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:all
      - run: npm run build
      - run: npm run check:i18n

  browser-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KNOMO_LAYOUT_PLAYWRIGHT: playwright
      KNOMO_LAYOUT_BROWSER: chromium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - name: Prepare browser test runtime
        run: |
          npx tsc -p tsconfig.test.json
          node -e "require('./.tmp/knomo-tests/tests/helpers/obsidianStub.js').ensureObsidianStub().catch(error => { console.error(error); process.exit(1); })"
      - name: Run browser layout tests
        run: node .tmp/knomo-tests/scripts/run-tests.js --test-reporter=spec --files $(grep -l KNOMO_LAYOUT_PLAYWRIGHT tests/*.test.ts)
